services:
  house-bot:
    build: .
    container_name: house-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Read-only: lets the watch module check Minecraft backup freshness.
      # Left side is the host path - adjust if the backups live elsewhere.
      - /home/ebk/minecraft-backups:/backups:ro
      # Read-only: weekly restore-test results the watch module announces.
      - /home/ebk/restore-test-results.log:/restore-results.log:ro
      # Writable: starboard message map lives here so it survives
      # container rebuilds and git pulls.
      - bot-data:/data
    # No ports: the bot dials OUT to Discord. Nothing exposed on the LAN.

volumes:
  bot-data:
